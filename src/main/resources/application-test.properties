spring.application.name=portfolio
server.port=0
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3307}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

application.security.jwt.secret-key=dGVzdC1qd3Qtc2VjcmV0LWtleS13aXRoLTMyeC1ieXRlcy1taW5pbXVtISE=
application.security.jwt.expiration=15
application.security.jwt.refresh-expiration-days=7
application.security.jwt.issuer=portfolio-hub-test
application.security.jwt.audience=portfolio-hub-api-test
application.security.cookie.domain=
application.security.cookie.secure=false
application.security.cookie.same-site=Lax
application.security.frontend.allowed-redirects=http://localhost:5173
application.security.frontend.default-redirect=http://localhost:5173/auth/callback
application.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000

google.drive.enabled=false
google.drive.oauth.client-id=test
google.drive.oauth.client-secret=test
google.drive.oauth.refresh-token=test
google.drive.folders.user-avatars=test
google.drive.folders.user-resumes=test
google.drive.folders.projects-cover=test
google.drive.folders.skills-icon=test
google.drive.folders.certificates=test

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
