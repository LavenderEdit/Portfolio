# Author: Studios TKOH!
spring.application.name=portfolio
server.port=${SERVER_PORT:8080}

# Habilitamos Flyway y dejamos que valide el esquema (no crear)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Ubicaci\u00f3n por defecto de Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# DataSource con placeholders y valores por defecto
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?${MYSQL_CONNECTION_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Configuraci\u00f3n de Seguridad y JWT
application.security.jwt.secret-key=${JWT_TOKEN}
application.security.jwt.expiration=${JWT_EXPIRATION_TIME}
application.security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
application.security.jwt.issuer=${JWT_ISSUER:portfolio-hub}
application.security.jwt.audience=${JWT_AUDIENCE:portfolio-hub-api}
application.security.cookie.domain=${COOKIE_DOMAIN:}
application.security.cookie.secure=${COOKIE_SECURE:true}
application.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
application.security.frontend.allowed-redirects=${FRONTEND_ALLOWED_REDIRECTS:http://localhost:3000}
application.security.frontend.default-redirect=${FRONTEND_DEFAULT_REDIRECT:http://localhost:3000/auth/callback}
application.security.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
application.security.email-verification.frontend-url=${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:3000/verify-email}

# Uploads
application.upload.max-image-size=${UPLOAD_MAX_IMAGE_SIZE:2MB}
application.upload.max-document-size=${UPLOAD_MAX_DOCUMENT_SIZE:5MB}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_DOCUMENT_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_DOCUMENT_SIZE:5MB}

# Configuraci\u00f3n de Google Drive
google.drive.oauth.client-id=${DRIVE_OAUTH_CLIENT_ID}
google.drive.oauth.client-secret=${DRIVE_OAUTH_CLIENT_SECRET}
google.drive.oauth.refresh-token=${DRIVE_OAUTH_REFRESH_TOKEN}
google.drive.folders.user-avatars=${DRIVE_FOLDER_USER_AVATARS}
google.drive.folders.user-resumes=${DRIVE_FOLDER_USER_RESUMES}
google.drive.folders.projects-cover=${DRIVE_FOLDER_PROJECTS_COVER}
google.drive.folders.skills-icon=${DRIVE_FOLDER_SKILLS_ICON}
google.drive.folders.certificates=${DRIVE_FOLDER_CERTIFICATES}
google.drive.enabled=${GOOGLE_DRIVE_ENABLED:true}

# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:disabled-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:disabled-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Configuraci\u00f3n de Email SMTP
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${GMAIL_APP_EMAIL}
spring.mail.password=${GMAIL_APP_PASSWORD}

# Propiedades de JavaMail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuraci\u00f3n de CORS
application.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Configuraci\u00f3n para proxies inversos (ej. Nginx, Cloudflare)
server.forward-headers-strategy=framework

# Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_EXPOSE_DETAILS:never}
management.info.env.enabled=true
