<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <th:block th:replace="~{fragments/_layout :: content}">
        <section class="section">
            <div class="section-heading">
                <h1>Explora los portafolios</h1>
                <p>Selecciona a la persona o marca para ver su perfil profesional completo.</p>
            </div>
            <div class="grid profile-grid" th:if="${#lists.isEmpty(profiles) == false}">
                <article class="profile-card" th:each="p : ${profiles}">
                    <div class="profile-avatar">
                        <img th:if="${p.avatarUrl}" th:src="${p.avatarUrl}" th:alt="${p.fullName}">
                        <div class="avatar placeholder" th:if="${p.avatarUrl == null}">
                            <span th:text="${#strings.substring(p.fullName,0,1)}">P</span>
                        </div>
                    </div>
                    <div class="profile-body">
                        <h2 th:text="${p.fullName}">Nombre</h2>
                        <p class="headline" th:text="${p.headline}">Headline</p>
                        <a class="btn primary" th:href="@{|/portfolio/${p.slug}|}">Ver portafolio</a>
                    </div>
                </article>
            </div>
            <p class="empty" th:if="${#lists.isEmpty(profiles)}">Aún no hay portafolios publicados.</p>
        </section>
    </th:block>
</html>
