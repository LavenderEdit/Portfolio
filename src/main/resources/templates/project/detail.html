<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <th:block th:replace="~{fragments/_layout :: content}">
        <article class="section project-detail">
            <div class="breadcrumbs">
                <a th:href="@{|/portfolio/${profile.slug}|}">&larr; Volver al portafolio</a>
            </div>
            <header class="project-header">
                <p class="project-meta" th:text="${project.startDate != null ? #temporals.format(project.startDate, 'MMM yyyy') : 'Proyecto personal'}">Abr 2024</p>
                <h1 th:text="${project.title}">Título del proyecto</h1>
                <p class="headline" th:text="${project.summary}">Resumen del proyecto.</p>
                <div class="links">
                    <a th:if="${project.repoUrl}" th:href="${project.repoUrl}" target="_blank" rel="noopener">Repositorio</a>
                    <a th:if="${project.liveUrl}" th:href="${project.liveUrl}" target="_blank" rel="noopener">Demo</a>
                </div>
            </header>
            <figure class="project-cover" th:if="${project.coverImage}">
                <img th:src="${project.coverImage}" th:alt="${project.title}">
            </figure>
            <section class="project-content">
                <h2>Descripción</h2>
                <p th:text="${project.description}">Descripción extensa del proyecto y el valor generado.</p>
                <div class="tags" th:if="${#lists.isEmpty(project.skills) == false}">
                    <span th:each="sk : ${project.skills}" th:text="${sk.name}">Tecnología</span>
                </div>
            </section>
        </article>
    </th:block>
</html>
