<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" th:content="${metaDescription} ?: 'Portafolio profesional construido con Spring Boot y Thymeleaf.'">
        <title th:text="${title} ?: 'Portfolio Hub'">Portfolio Hub</title>
        <link rel="stylesheet" th:href="@{/css/site.css}">
    </head>
    <body>
        <header th:replace="fragments/_navbar :: navbar"></header>

        <main class="page">
            <!-- aquí se inyecta el contenido de cada vista -->
            <th:block th:replace="${content}"></th:block>
        </main>

        <footer th:replace="*fragments/_footer :: footer"></footer>
        <script th:src="@{/js/site.js}" defer></script>
    </body>
</html>
